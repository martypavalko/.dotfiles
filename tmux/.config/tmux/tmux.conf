# Config and help
bind -N "Reload configuration" r source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"

# Vi mode for copy
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set-option -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue


# better navigation
bind -r ^ last-window
bind k select-pane -U
bind j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind x kill-pane
bind X confirm kill-window
bind C-y set-window-option synchronize-panes
bind b copy-mode
bind p paste-buffer
bind % command-prompt -I "#W" "rename-window '%%'"

# vim-like commands for resizing panes
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

# pop up windows
bind g display-popup -h "90%" -w "90%" -d '#{pane_current_path}' -E 'lazygit'
bind C-f display-popup -T "Jump to Session" -E "$HOME/.dotfiles/scripts/tmux-sessionizer.sh --jump"
bind C-o display-popup -E "tmux capture-pane -J -p | grep -Eo 'https?://[^\"()<>{}|\\\\^`]+' | fzf | xargs open"
bind C-p display-popup -E "tmux capture-pane -J -p | grep -Eo 'https?://[^\"()<>{}|\\\\^`]+' | fzf | pbcopy"
bind a display-popup -E "aws configure list-profiles | fzf | xargs -I{} tmux set-environment AWS_PROFILE {}"
bind m display-popup -T "Move Session" -E "$HOME/.dotfiles/scripts/tmux-sessionizer.sh -m"
bind t display-popup -T "Create Session" -E "$HOME/.dotfiles/scripts/tmux-sessionizer.sh -c"
bind C-v display-popup -T "Start SSH Session" -E "$HOME/.dotfiles/scripts/tmux-sessionizer.sh --ssh"
bind . run-shell "$HOME/.dotfiles/scripts/tmux-sessionizer.sh --scratch"
bind o new-window -n notes 'nvim $obsidian_dir'
