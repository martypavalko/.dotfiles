$hostname\
$localip\
$shlvl\
$singularity\
$nats\
$directory\
$vcsh\
$fossil_branch\
$fossil_metrics\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$hg_state\
$pijul_channel\
$docker_context\
$package\
$bun\
$c\
$cmake\
$cobol\
$cpp\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$gleam\
$golang\
$gradle\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$lua\
$maven\
$mojo\
$nim\
$nodejs\
$ocaml\
$odin\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$quarto\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$typst\
$vlang\
$vagrant\
$xmake\
$zig\
$buf\
$guix_shell\
$nix_shell\
$conda\
$pixi\
$meson\
$spack\
$memory_usage\
$kubernetes\
$aws\
$gcloud\
$openstack\
$azure\
$direnv\
$env_var\
$mise\
$crystal\
$custom\
$sudo\
$cmd_duration\
$line_break\
$jobs\
$battery\
$time\
$status\
$container\
$netns\
$os\
$shell\
$character"""

[aws]
format = '[$symbol($profile )(\($region\) )(\[$duration\] )]($style) '
symbol = " "
style = 'bold dimmed yellow'

[azure]
symbol = " "

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[buf]
symbol = " "

[bun]
symbol = " "

[c]
format = ' [$symbol($version(-$name) )]($style)'
symbol = " "

[cpp]
symbol = " "

[cmake]
symbol = " "

[cmd_duration]
format = " [$duration]($style)"

[cobol]
symbol = " "

[conda]
symbol = " "

[container]
symbol = " "

[crystal]
symbol = " "

[dart]
symbol = " "

[deno]
symbol = " "

[direnv]
symbol = " "

[directory]
read_only = " 󰌾"

[docker_context]
symbol = " "

[dotnet]
format = " [$symbol($version )(🎯 $tfm )]($style)"
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[erlang]
symbol = " "

[fennel]
symbol = " "

[fortran]
symbol = " "

[fossil_branch]
symbol = " "

[gcloud]
symbol = "󱇶 "

[gleam]
symbol = " "

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = 'yellow'

[git_commit]
tag_symbol = '  '
style = 'yellow'

[git_status]
format = '[$all_status$ahead_behind]($style) '
style = 'yellow'
ahead = '⇡${count} '
diverged = '⇕${ahead_count}⇣${behind_count} '
behind = '⇣${count} '
conflicted = '='
up_to_date = ''
untracked = '?'
modified = '!'
stashed = '\$'
staged = '+'
renamed = '»'
deleted = '✘'

[golang]
format = " [$symbol($version)]($style)"
symbol = " "

[gradle]
symbol = " "

[guix_shell]
symbol = " "

[haskell]
symbol = " "

[haxe]
symbol = " "

[helm]
symbol = " "

[hg_branch]
symbol = " "

[hostname]
ssh_symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[kotlin]
symbol = " "

[kubernetes]
format = '[$symbol$context(/$namespace)]($style) '
disabled = false
# contexts = [
#   { context_pattern = "dev.local.cluster.k8s", style = "green", symbol = "💔 " },
# ]
symbol = "󱃾 "
style = 'bold dimmed blue'

[[kubernetes.contexts]]
context_pattern = 'arn:aws:eks:[\w-]+:\d+:cluster/(?P<cluster>[\w-]+)'
context_alias = 'eks-$cluster'

[lua]
format = " [$symbol$version]($style) "
symbol = " "

[maven]
symbol = " "

[memory_usage]
symbol = "󰍛 "

[meson]
symbol = "󰔷 "

[mojo]
symbol = "󰈸 "

[nats]
symbol = " "

[netns]
symbol = "󰛳 "

[nim]
symbol = " "

[nix_shell]
symbol = " "

[nodejs]
format = " [$symbol($version)]($style)"
symbol = " "

[ocaml]
symbol = " "

[odin]
symbol = "󰟢 "

[opa]
symbol = " "

[openstack]
